[versions]
client-snyk = "1.0.0"
clikt = "5.2.1"
junit = "6.1.3"
klogging = "0.11.8"
kotest = "6.2.7"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"

[plugins]
kotlin-plugin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotest = { id = "io.kotest", version.ref = "kotest" }

[libraries]
client-snyk = { group = "dev.mosaify", name = "client-snyk-classic", version.ref = "client-snyk" }
clikt = { group = "com.github.ajalt.clikt", name = "clikt", version.ref = "clikt" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
slf4j-klogging = { module = "io.klogging:slf4j-klogging", version.ref = "klogging" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
kotest-bom = { module = "io.kotest:kotest-bom", version.ref = "kotest" }

kotest-runner-junit6 = { module = "io.kotest:kotest-runner-junit6" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core" }
